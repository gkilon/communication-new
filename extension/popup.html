<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 280px; font-family: Arial, sans-serif; background: #111827; color: #fff; padding: 16px; margin: 0; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #374151; background: #1f2937; color: #fff; }
    button { width: 100%; padding: 10px; border-radius: 6px; border: none; background: #0891b2; color: #fff; font-weight: bold; cursor: pointer; }
    button:hover { background: #0e7490; }
    #status { font-size: 12px; margin-top: 8px; text-align: center; }
    .error { color: #f87171; }
    .success { color: #34d399; }
    #logged-in { display: none; text-align: center; }
    #logged-in p { font-size: 13px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div id="login-form">
    <h2>התחברות</h2>
    <input type="email" id="email" placeholder="אימייל" />
    <input type="password" id="password" placeholder="סיסמה" />
    <button id="login-btn">התחבר</button>
    <div id="status"></div>
  </div>

  <div id="logged-in">
    <p>מחובר/ת כ-<span id="user-email"></span></p>
    <p style="color:#9ca3af;">לך/י ל-Gmail ותראה/י כפתור בדיקת מייל ליד כל טיוטה.</p>
    <button id="logout-btn">התנתק/י</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
