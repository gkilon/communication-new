    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <title>שאלון סגנונות תקשורת</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" crossorigin="anonymous"></script>
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Assistant', 'sans-serif'],
            },
            colors: {
              neon: {
                cyan: '#00f3ff',
                magenta: '#bc13fe',
                purple: '#8a2be2',
                green: '#00ff66'
              },
              glass: {
                dark: 'rgba(5, 5, 10, 0.85)',
                light: 'rgba(255, 255, 255, 0.03)',
                border: 'rgba(0, 243, 255, 0.2)'
              }
            },
            boxShadow: {
              'neon-cyan': '0 0 15px rgba(0, 243, 255, 0.5), 0 0 30px rgba(0, 243, 255, 0.3)',
              'neon-magenta': '0 0 15px rgba(188, 19, 254, 0.5), 0 0 30px rgba(188, 19, 254, 0.3)',
              'neon-purple': '0 0 15px rgba(138, 43, 226, 0.5), 0 0 30px rgba(138, 43, 226, 0.3)',
              'neon-green': '0 0 15px rgba(0, 255, 102, 0.5), 0 0 30px rgba(0, 255, 102, 0.3)',
            },
            backgroundImage: {
              'cyber-grid': 'linear-gradient(transparent 95%, rgba(0, 243, 255, 0.1) 100%), linear-gradient(90deg, transparent 95%, rgba(0, 243, 255, 0.1) 100%)',
              'mesh-gradient': 'radial-gradient(at 20% 0%, rgba(138,43,226,0.3) 0, transparent 40%), radial-gradient(at 80% 100%, rgba(0,243,255,0.2) 0, transparent 40%), radial-gradient(at 0% 100%, rgba(188,19,254,0.15) 0, transparent 50%)',
            }
          }
        }
      }
    </script>
    
    <style>
      :root {
        color-scheme: dark !important;
        --background-color: #030305;
      }
      
      html {
        background-color: #030305 !important;
        color-scheme: dark !important;
        forced-color-adjust: none !important;
      }

      body {
        background-color: #0f172a !important;
        forced-color-adjust: none !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }

      #root {
        background-color: transparent !important;
        min-height: 100vh;
      }

      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      .animate-fade-in-up { animation: fade-in-up 0.5s ease-out forwards; }
      .text-shadow { text-shadow: 1px 1px 4px rgba(0, 0, 0, 1) !important; }

      .chart-quadrant {
         mix-blend-mode: normal !important;
         filter: none !important;
         opacity: 1 !important;
      }

      .pdf-export-mode {
        padding: 25px !important;
        width: 1000px !important;
        background-color: #0f172a !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }
      .pdf-export-mode * {
        text-shadow: none !important;
        box-shadow: none !important;
      }
      .pdf-export-mode .header-section {
        margin-bottom: 15px !important;
        padding-bottom: 10px !important;
      }
      .pdf-export-mode h1 { font-size: 2.2rem !important; }
      .pdf-export-mode .main-content-gap { gap: 15px !important; margin-bottom: 15px !important; }
      .pdf-export-mode .summary-box { 
        padding: 18px !important; 
        margin-top: 0 !important;
        background: #1e293b !important;
        border: 1px solid #334155 !important;
      }
      .pdf-export-mode .chart-container { padding: 12px !important; background: #1e293b !important; }
      .pdf-export-mode .analysis-container { padding: 12px !important; background: #1e293b !important; }
      .pdf-export-mode p, .pdf-export-mode li, .pdf-export-mode div { 
        font-size: 0.9rem !important; 
        line-height: 1.35 !important;
      }
      .pdf-export-mode h3 { font-size: 1.3rem !important; margin-bottom: 8px !important; }
      .pdf-export-mode h4 { font-size: 1.05rem !important; margin-bottom: 3px !important; }
      .pdf-export-mode .space-y-6 > * + * { margin-top: 8px !important; }
      .pdf-export-mode .tags-container { display: none !important; } 
    </style>
