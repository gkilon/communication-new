<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#F7F2E7">
    <title>Kilon Communication</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" crossorigin="anonymous"></script>
    
    <script>
      // Kilon Consulting brand palette — matched from kilon-consulting.com (warm ivory,
      // near-black ink, muted blue-grey/lavender secondary, burnt terracotta primary accent).
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Assistant', 'sans-serif'],
            },
            colors: {
              kilon: {
                bg: '#F7F2E6',        // warm ivory page background
                card: '#FFFDF8',      // slightly lighter card surface
                ink: '#1E1B16',       // near-black primary text
                inkSoft: '#6B6355',   // muted secondary text
                border: '#E6DCC8',    // warm hairline border
                slate: '#838B9E',     // muted blue-grey / lavender secondary accent
                terracotta: '#BD5B36',    // primary brand accent
                terracottaDark: '#9C4A2B',
              }
            },
            backgroundImage: {
              'kilon-cta': 'linear-gradient(90deg, #838B9E 0%, #BD5B36 100%)',
            }
          }
        }
      }
    </script>
    
    <style>
      :root {
        color-scheme: light !important;
        --background-color: #F7F2E6;
      }
      
      html {
        background-color: #F7F2E6 !important;
        color-scheme: light !important;
        forced-color-adjust: none !important;
      }

      body {
        background-color: #F7F2E6 !important;
        forced-color-adjust: none !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }

      #root {
        background-color: transparent !important;
        min-height: 100vh;
      }

      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      .animate-fade-in-up { animation: fade-in-up 0.5s ease-out forwards; }
      .text-shadow { text-shadow: 1px 1px 4px rgba(0, 0, 0, 1) !important; }

      /* Thin "blueprint" line-art background motif — outlined circles, a rotated
         diamond, and scattered dots, matching kilon-consulting.com's page texture. */
      .kilon-blueprint-bg {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
      }
      .kilon-blueprint-bg svg { position: absolute; opacity: 0.08; }

      .chart-quadrant {
         mix-blend-mode: normal !important;
         filter: none !important;
         opacity: 1 !important;
      }

      .pdf-export-mode {
        padding: 25px !important;
        width: 1000px !important;
        background-color: #0f172a !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }
      .pdf-export-mode * {
        text-shadow: none !important;
        box-shadow: none !important;
      }
      .pdf-export-mode .header-section {
        margin-bottom: 15px !important;
        padding-bottom: 10px !important;
      }
      .pdf-export-mode h1 { font-size: 2.2rem !important; }
      .pdf-export-mode .main-content-gap { gap: 15px !important; margin-bottom: 15px !important; }
      .pdf-export-mode .summary-box { 
        padding: 18px !important; 
        margin-top: 0 !important;
        background: #1e293b !important;
        border: 1px solid #334155 !important;
      }
      .pdf-export-mode .chart-container { padding: 12px !important; background: #1e293b !important; }
      .pdf-export-mode .analysis-container { padding: 12px !important; background: #1e293b !important; }
      .pdf-export-mode p, .pdf-export-mode li, .pdf-export-mode div { 
        font-size: 0.9rem !important; 
        line-height: 1.35 !important;
      }
      .pdf-export-mode h3 { font-size: 1.3rem !important; margin-bottom: 8px !important; }
      .pdf-export-mode h4 { font-size: 1.05rem !important; margin-bottom: 3px !important; }
      .pdf-export-mode .space-y-6 > * + * { margin-top: 8px !important; }
      .pdf-export-mode .tags-container { display: none !important; } 
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@netlify/functions": "https://aistudiocdn.com/@netlify/functions@^5.1.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.0",
    "vite": "https://aistudiocdn.com/vite@^7.2.2",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.0",
    "firebase/": "https://aistudiocdn.com/firebase@^12.6.0/",
    "buffer": "https://aistudiocdn.com/buffer@^6.0.3"
  }
}
</script>
</head>
  <body class="text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
